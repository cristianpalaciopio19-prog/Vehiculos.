<form class="filters" method="get">
  <label>Ruta
    <select name="ruta" onchange="this.form.submit()"><option value="">Todas las rutas</option>
      {% for r in rutas %}<option {{ 'selected' if f.ruta==r.nombre }}>{{ r.nombre }}</option>{% endfor %}
    </select></label>
  <label>Desde<input type="date" name="desde" value="{{ f.desde }}" onchange="this.form.submit()"></label>
  <label>Hasta<input type="date" name="hasta" value="{{ f.hasta }}" onchange="this.form.submit()"></label>
  <div class="acts">
    {% if f.ruta or f.desde or f.hasta %}<a class="btn btn-line btn-sm" href="{{ request.path }}">Quitar filtros</a>{% endif %}
    <a class="btn btn-y btn-sm" href="{{ url_for('exportar', **f) }}">Exportar a Excel</a>
  </div>
</form>
