<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102A5C">
<title>{% block title %}Encuesta de satisfacción del servicio de transporte{% endblock %}</title>
{% if logo_v %}<link rel="icon" href="{{ url_for('logo', v=logo_v) }}">{% endif %}
<link href="{{ url_for('static', filename='fonts/fonts.css') }}" rel="stylesheet">
<style>
:root{
  --navy:#102A5C; --ink:#1B2333; --text:#3F4756; --y:#E9B200; --y-soft:#FFF6D6;
  --mute:#6B7280; --rule:#E3E6EB; --field:#B8C0CC; --bg:#fff; --tint:#F6F7F9;
  --good:#102A5C; --mid:#E9B200; --bad:#B4372B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 17px/1.6 'Source Sans 3',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;color:var(--navy);margin:0;line-height:1.2}
a{color:var(--navy)}
.band{height:6px;background:var(--navy);border-bottom:3px solid var(--y)}
.logo{display:block;height:44px;width:auto;max-width:220px;object-fit:contain}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:4px;padding:11px 18px;font:600 16px 'Source Sans 3';cursor:pointer;text-decoration:none;line-height:1.2}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:#0B1F45}
.btn-y{background:var(--y);color:var(--ink)}
.btn-y:hover{filter:brightness(1.05)}
.btn-line{background:#fff;color:var(--navy);border-color:var(--field)}
.btn-line:hover{border-color:var(--navy)}
.btn-sm{padding:8px 13px;font-size:15px}
input[type=text],input[type=password],input[type=date],input[type=file],select,textarea{width:100%;font:400 17px 'Source Sans 3';color:var(--ink);padding:11px 13px;border:1px solid var(--field);border-radius:4px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid rgba(233,178,0,.55);outline-offset:1px}
.flash{background:var(--y-soft);border-left:4px solid var(--y);padding:10px 14px;margin:16px 0;font-size:15.5px}
.muted{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
{% block css %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
{% block js %}{% endblock %}
</body>
</html>
