<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B2C6B">
<title>{% block title %}Encuesta de satisfacción del servicio de transporte{% endblock %} · Colombina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2C6B; --navy-2:#0e3880; --blue:#1B5FC4; --sky:#CFE0FA; --gold:#F2A900;
  --bg:#F4F6FA; --card:#fff; --ink:#1A2233; --muted:#5B6578; --line:#E3E8F0;
  --ok:#1E8E5A; --warn:#E0A100; --bad:#C8372D; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Poppins,Inter,sans-serif;margin:0;line-height:1.25;color:var(--navy)}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.wrap-wide{max-width:1240px;margin:0 auto;padding:0 20px}

/* Barra superior */
.topbar{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.topbar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:600;letter-spacing:.3px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand small{display:block;font-family:Inter;font-weight:400;font-size:11.5px;opacity:.75;letter-spacing:0}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:#fff;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:8px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.nav a.on{background:rgba(255,255,255,.12);opacity:1;box-shadow:inset 0 -2px 0 var(--gold)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(11,44,107,.04),0 4px 16px rgba(11,44,107,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font:600 14.5px Inter;cursor:pointer;text-decoration:none;transition:.15s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--blue)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;font:15px Inter;color:var(--ink);padding:11px 12px;border:1px solid #CBD3E1;border-radius:10px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,95,196,.15)}
label{font-weight:500}
.flash{background:#FFF6E0;border:1px solid #F5D27A;color:#7A5600;padding:10px 14px;border-radius:10px;margin:16px 0;font-size:14px}
.muted{color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:28px 16px}
{% block css %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
{% block js %}{% endblock %}
</body>
</html>
